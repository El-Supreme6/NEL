<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="images/nel-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>Staff Panel | Neo Egoist League</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .adm-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
        .adm-who{display:flex;align-items:center;gap:12px}
        .adm-who img{width:40px;height:40px;object-fit:cover;border:1px solid var(--line)}
        .adm-tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:24px;padding-bottom:4px;scrollbar-width:none}
        .adm-tabs button{flex-shrink:0}
        .adm-grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
        .adm-form,.adm-list{background:var(--panel);border:1px solid var(--line);padding:20px}
        .adm-form p{margin-bottom:16px}
        .adm-form label{display:grid;gap:6px;margin-bottom:14px}
        .adm-form label.chk{display:flex;align-items:center;gap:10px}
        .adm-form label>span{font:600 11px/1.3 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
        .adm-form input,.adm-form select,.adm-form textarea{width:100%;min-height:44px;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:0;color:var(--white);font-size:16px}
        .adm-form input:focus,.adm-form select:focus,.adm-form textarea:focus{outline:0;border-color:var(--cyan)}
        .adm-form input[type=checkbox]{width:20px;height:20px;min-height:0}
        .adm-form textarea{min-height:110px;resize:vertical}
        .adm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
        .adm-row:last-child{border-bottom:0}
        .adm-row small{color:var(--muted)}
        .adm-actions{display:flex;gap:8px;flex-shrink:0}
        .adm-msg{padding:12px 16px;margin-bottom:16px;border:1px solid var(--cyan-dim);border-left:2px solid var(--cyan);color:var(--white)}
        .adm-msg.bad{border-color:var(--bad);border-left-color:var(--bad)}
        .adm-msg[hidden]{display:none}
        @media (max-width:860px){.adm-grid{grid-template-columns:1fr}.adm-row{flex-direction:column;align-items:flex-start}}
    </style>
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">
            <img src="images/nel-logo.png" alt="NEL Logo">
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="matches.html">Matches</a>
            <a href="standings.html">Standings</a>
            <a href="teams.html">Teams</a>
            <a href="players.html">Players</a>
            <a href="market.html">Market</a>
            <a href="stats.html">Stats</a>
            <a href="news.html">News</a>
            <a href="about.html">About</a>
        </div>

        <a class="discord-button" href="https://discord.gg/FYT7ujxwv" target="_blank" rel="noopener">
            Discord
        </a>

        <button class="menu-toggle" aria-label="Open navigation menu">
            ☰
        </button>

    </nav>

    <main>

        <section class="stats-header">
            <p class="eyebrow">NEO EGOIST LEAGUE</p>
            <h1>STAFF PANEL</h1>
            <p class="stats-description">Matches, results, stats, news and transfers. Staff only.</p>
        </section>

        <div class="section" id="admin-app">
            <p>Loading…</p>
        </div>

    </main>

    <footer>
        <h2>NEL</h2>
        <p>ONE LEAGUE. ONE GOAL. BECOME THE BEST.</p>
        <small>© 2026 Neo Egoist League</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="admin.js"></script>

</body>
</html>
