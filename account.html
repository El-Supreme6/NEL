<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="images/nel-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <title>My Account | Neo Egoist League</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .adm-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
        .adm-who{display:flex;align-items:center;gap:12px}
        .adm-who img{width:40px;height:40px;object-fit:cover;border:1px solid var(--line)}
        .adm-form,.adm-list{background:var(--panel);border:1px solid var(--line);padding:20px}
        .adm-form h2,.adm-list h2{margin-bottom:12px;font-size:34px;letter-spacing:.08em}
        .adm-form p{margin-bottom:16px}
        .adm-list input{min-height:44px;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:0;color:var(--white);font-size:16px}
        .adm-list input:focus{outline:0;border-color:var(--cyan)}
        .adm-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
        .adm-row:last-child{border-bottom:0}
        .adm-row small{color:var(--muted)}
        .adm-actions{display:flex;gap:8px;align-items:center}
        .adm-msg{padding:12px 16px;margin-bottom:16px;border:1px solid var(--cyan-dim);border-left:2px solid var(--cyan);color:var(--white)}
        .adm-msg.bad{border-color:var(--bad);border-left-color:var(--bad)}
        .adm-msg[hidden]{display:none}
        @media (max-width:860px){.adm-row{flex-direction:column;align-items:flex-start}}
    </style>
</head>

<body>

    <nav class="navbar">

        <a href="index.html" class="logo">
            <img src="images/nel-logo.png" alt="NEL Logo">
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="matches.html">Matches</a>
            <a href="standings.html">Standings</a>
            <a href="teams.html">Teams</a>
            <a href="players.html">Players</a>
            <a href="market.html">Market</a>
            <a href="stats.html">Stats</a>
            <a href="news.html">News</a>
            <a href="about.html">About</a>
        </div>

        <a class="discord-button" href="https://discord.gg/FYT7ujxwv" target="_blank" rel="noopener">
            Discord
        </a>

        <button class="menu-toggle" aria-label="Open navigation menu">
            ☰
        </button>

    </nav>

    <main>

        <section class="stats-header">
            <p class="eyebrow">NEO EGOIST LEAGUE</p>
            <h1>MY ACCOUNT</h1>
            <p class="stats-description">Players set their transfer status. Masters list players and handle offers.</p>
        </section>

        <div class="section" id="account-app">
            <p>Loading…</p>
        </div>

    </main>

    <footer>
        <h2>NEL</h2>
        <p>ONE LEAGUE. ONE GOAL. BECOME THE BEST.</p>
        <small>© 2026 Neo Egoist League</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
    <script src="supabase.js"></script>
    <script src="script.js"></script>
    <script src="account.js"></script>

</body>
</html>
