<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="images/nel-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>History | Neo Egoist League</title>
    <meta name="description" content="Every past Neo Egoist League season: standings, results, awards and stats.">

    <link rel="stylesheet" href="style.css">

    <style>
        .hx-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px}
        .hx-block{margin-bottom:64px}
        .hx-match{background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
        .hx-match summary{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:16px 20px;cursor:pointer;list-style:none}
        .hx-match summary::-webkit-details-marker{display:none}
        .hx-match summary span{font:600 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
        .hx-match summary strong{font:700 22px/1.1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--white)}
        .hx-match summary small{margin-left:auto;color:var(--muted)}
        .hx-match[open]{border-color:var(--cyan-dim)}
        .hx-body{padding:0 20px 20px}
    </style>
</head>

    <nav class="navbar">

        <a href="index.html" class="logo">

            Discord
        </a>

        <button class="menu-toggle" aria-label="Open navigation menu">
            ☰
        </button>

    </nav>

    <main>

        <section class="stats-header">
            <p class="eyebrow">NEO EGOIST LEAGUE</p>
            <h1>HISTORY</h1>
            <p class="stats-description">Every finished season: final table, results, awards and player stats.</p>
        </section>
